# Integración continua: se ejecuta en cada push y pull request.
# Si el lint o alguna prueba falla, el pipeline falla y deploy.yml NO despliega.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint con flake8
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar flake8
        run: pip install flake8
      - name: Revisar estilo del código
        run: flake8 .

  pruebas:
    name: Pruebas unitarias, de integración y cobertura
    runs-on: ubuntu-latest
    needs: lint
    env:
      USE_SQLITE: "1"
      CELERY_EAGER: "1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt coverage
      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run
      - name: Ejecutar pruebas (tests/ unitarias + integración y pruebas de la app) midiendo cobertura
        run: coverage run manage.py test -v 2
      - name: Reporte de cobertura
        run: |
          coverage report
          coverage xml
          coverage html -d reporte_cobertura
          echo "## Cobertura de pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: |
            reporte_cobertura/
            coverage.xml

  seguridad:
    name: Seguridad de dependencias (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: pip install pip-audit
      - name: Buscar vulnerabilidades conocidas
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    name: Construir imagen Docker (y publicarla en main)
    runs-on: ubuntu-latest
    needs: [pruebas, seguridad]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir la imagen (versionada con el commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/danielgothos-bit/microservicio_analitica_analytics_service:${{ github.sha }}
            ghcr.io/danielgothos-bit/microservicio_analitica_analytics_service:latest
